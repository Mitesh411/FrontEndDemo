name: sitespeed.io
on: push
jobs:
  run-sitespeed:
    runs-on: ubuntu-latest
    name: running sitespeed.io
    permissions:
      contents: read
    steps:
      - name: code checkout
        uses: actions/checkout@v7.0.1
     
     # Make directory to upload the test results
      - name: Make Directory for results
        run: mkdir -p testResults
     
      - name: running sitespeed.io container with arguments and optional Docker options
        run: docker run --rm -v "$(pwd):/sitespeed.io" sitespeedio/sitespeed.io:42.10.0  --outputFolder sitespeed.io https://mitesh411.github.io/MyResume/ -n 1
      
    # Upload the contents of Test Results directory to workspace
      - name: Output the run Details
        uses: actions/upload-artifact@v7.0.2
        with:
          name: RunReports
          path: sitespeed.io
